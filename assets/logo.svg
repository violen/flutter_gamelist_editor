<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Anthracite Rounded Square -->
  <rect width="512" height="512" rx="100" fill="#1A1A1A"/>
  
  <!-- Safe Zone Group: Scaled down to ~65% to avoid being cut off by Android Masks -->
  <g transform="translate(102, 102) scale(0.6)">
    <!-- Switch Body / Screen Area -->
    <rect x="120" y="160" width="272" height="192" rx="15" stroke="#FF7800" stroke-width="30"/>
    
    <!-- Left Joy-Con -->
    <path d="M120 160H100C70 160 50 190 50 220V298C50 328 70 358 100 358H120V160Z" fill="#FF7800"/>
    <circle cx="85" cy="220" r="22" fill="#1A1A1A"/> <!-- Analog Stick L - Bolder -->
    
    <!-- Right Joy-Con -->
    <path d="M392 160H412C442 160 462 190 462 220V298C462 328 442 358 412 358H392V160Z" fill="#FF7800"/>
    <circle cx="427" cy="300" r="22" fill="#1A1A1A"/> <!-- Analog Stick R - Bolder -->

    <!-- Simplified List Content on Screen -->
    <!-- Line 1 -->
    <rect x="170" y="210" width="35" height="35" rx="6" fill="#FF7800"/> <!-- Checkbox 1 -->
    <rect x="225" y="222" width="120" height="12" rx="6" fill="#FF7800"/> <!-- Text line 1 -->
    
    <!-- Line 2 -->
    <rect x="170" y="265" width="35" height="35" rx="6" fill="#FF7800"/> <!-- Checkbox 2 -->
    <rect x="225" y="277" width="90" height="12" rx="6" fill="#FF7800"/> <!-- Text line 2 -->
  </g>
</svg>
